<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    button { margin: 2px 4px 2px 0; padding: 6px 10px; cursor: pointer; }
    #status { color: #666; margin: 6px 0; word-break: break-all; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 4px; font-size: 12px; text-align: left; }
  </style>
</head>
<body>
  <h1>BOSS 岗位助手（只读）</h1>
  <button id="scrape">抓取当前页岗位</button>
  <button id="csv">下载 CSV</button>
  <button id="json">下载 JSON</button>
  <button id="diag">结构诊断(复制)</button>
  <button id="auto">打开自动投递助手</button>
  <div id="status">请先打开 BOSS 岗位列表页，再点「抓取」。仅读取，不做任何操作。</div>
  <table id="tbl"></table>
  <script src="popup.js"></script>
</body>
</html>
